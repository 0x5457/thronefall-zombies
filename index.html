<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17291f" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0a1610;
      }
      body {
        overflow: hidden;
      }
      #loading {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: radial-gradient(circle at 50% 42%, #2d4b37 0, #1c3029 38%, #11231d 100%);
        color: #f6e8c2;
        font-family: 'DM Sans', 'Microsoft YaHei', sans-serif;
      }
      #loading .loading-tree {
        display: grid;
        width: 78px;
        height: 78px;
        margin-bottom: 20px;
        place-items: center;
        border: 2px solid #08130d;
        background: #0e2017;
        box-shadow: inset 0 0 0 3px rgba(242, 201, 107, 0.28);
        clip-path: polygon(
          6px 0,
          calc(100% - 6px) 0,
          100% 6px,
          100% calc(100% - 6px),
          calc(100% - 6px) 100%,
          6px 100%,
          0 calc(100% - 6px),
          0 6px
        );
      }
      #loading .loading-tree svg {
        width: 40px;
        height: 46px;
        fill: #f2c96b;
      }
      #loading .loading-kicker {
        margin-bottom: 13px;
        color: #a9c076;
        font-size: 9px;
        letter-spacing: 2px;
      }
      #loading h2 {
        margin: 0 0 14px;
        color: #ffe9b0;
        font:
          700 30px 'DM Sans',
          sans-serif;
        letter-spacing: 6px;
        text-indent: 6px;
      }
      #loading p {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0;
        font-size: 13px;
        letter-spacing: 2px;
        color: #cfc09a;
      }
      #loading p i {
        width: 6px;
        height: 6px;
        background: #f2c96b;
      }
      #loading .loading-progress {
        width: 210px;
        height: 9px;
        margin-top: 24px;
        padding: 2px;
        border: 2px solid #08130d;
        background: rgba(0, 0, 0, 0.45);
      }
      #loading .loading-progress i {
        display: block;
        width: 0;
        height: 100%;
        background: #f2c96b;
        transition: width 0.25s ease-out;
      }
      #loading .loading-meta {
        display: flex;
        justify-content: space-between;
        width: 210px;
        margin-top: 9px;
        color: #91a487;
        font-size: 9px;
        letter-spacing: 1px;
      }
    </style>
    <title>PINEFALL · 松林余烬</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%2396ab6a' d='M32 3 12 29h11L7 47h20v14h10V47h20L41 29h11Z'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <main id="app">
      <canvas id="world" tabindex="0" aria-label="松林营地三维游戏场景"></canvas>
      <div class="vignette"></div>
      <div
        id="rv-fade"
        hidden
        aria-hidden="true"
        style="position: absolute; inset: 0; background: #202e2b; z-index: 5; opacity: 0"
      ></div>
      <div id="loading">
        <div class="loading-tree" aria-hidden="true">
          <svg viewBox="0 0 40 44"><path d="M20 2 8 20h7L4 35h13v7h6v-7h13L25 20h7Z" /></svg>
        </div>
        <span class="loading-kicker">BLACK PINE / CAMPSITE 07</span>
        <h2>PINEFALL</h2>
        <p id="loading-message">
          <span id="loading-message-text">正在整理资源</span><i aria-hidden="true"></i>
        </p>
        <div
          class="loading-progress"
          role="progressbar"
          aria-label="资源加载进度"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <i id="loading-progress-bar"></i>
        </div>
        <div class="loading-meta">
          <span id="loading-percent">0%</span><span>RESOURCE CHECK</span>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
